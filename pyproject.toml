[project]
name = "hindi-slm"
version = "0.0.1"
description = "A small Hindi + Hinglish language model built end to end: data, tokenizer, continued pretraining, SFT, DPO, quantization."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch>=2.8",
    "transformers>=5.0",       # Qwen3_5ForCausalLM (hybrid Gated DeltaNet + attention)
    "datasets>=3.0",
    "huggingface-hub>=0.30",
    "pyyaml>=6.0",
    "wandb>=0.19",
]

[project.optional-dependencies]
eval = ["lm-eval>=0.4.9"]
# Fast kernels for Qwen3.5's linear-attention layers and fused cross-entropy (CUDA pods only).
gpu = [
    "flash-linear-attention>=0.4; sys_platform == 'linux'",
    "kernels>=0.4; sys_platform == 'linux'",
    "liger-kernel>=0.6; sys_platform == 'linux'",
]
dev = ["pytest>=8.0", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hindi_slm"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
