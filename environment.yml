# conda env create -f environment.yml && conda activate hindi-slm
# On a GPU pod, add the CUDA kernels and eval tools afterwards:
#   pip install -e ".[gpu,eval]" -c constraints.txt
name: hindi-slm
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - -c constraints.txt
      - -e .[dev]
